services:
  - type: web
    name: club-scout-ai
    runtime: python
    pythonVersion: "3.12.6"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./scout.db
      - key: CLUB_NAME
        value: Paris S-G
      - key: CLUB_LEAGUE
        value: Ligue 1
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://alexdaucourt.dev,https://www.alexdaucourt.dev,http://localhost:5173,http://127.0.0.1:5173
      - key: SCOUT_API_KEY
        sync: false
